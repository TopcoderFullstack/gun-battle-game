<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BATTLE ROYALE 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; position: fixed; top: 0; left: 0; outline: none; }

    #overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', 'PingFang SC', monospace;
    }
    #overlay.hidden { display: none; }

    #overlay-box {
      text-align: center; color: #fff; padding: 40px 50px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; max-width: 480px;
    }
    #overlay-box h1 {
      font-size: 40px; font-weight: 900; letter-spacing: 3px;
      background: linear-gradient(135deg, #f44, #f80, #fc0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    #overlay-box .sub { font-size: 13px; color: #888; margin-bottom: 24px; }
    #overlay-box .controls { text-align: left; margin-bottom: 24px; }
    #overlay-box .controls p { font-size: 12px; color: #aaa; margin-bottom: 4px; }
    #overlay-box kbd {
      display: inline-block; background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 3px;
      padding: 1px 7px; font-size: 11px; color: #fc0; margin-right: 4px;
    }
    #start-btn {
      background: linear-gradient(135deg, #c00, #f33); color: #fff;
      border: none; padding: 12px 48px; font-size: 18px;
      font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      border-radius: 6px; cursor: pointer; transition: all 0.2s;
    }
    #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,0,0,0.5); }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="overlay-box">
      <h1 id="overlay-title">BATTLE ROYALE</h1>
      <p class="sub">Havok Physics · Babylon.js · 缩圈吃鸡</p>
      <div class="controls">
        <p><kbd>W A S D</kbd> Move</p>
        <p><kbd>Mouse</kbd> Look & Shoot</p>
        <p><kbd>1</kbd><kbd>2</kbd><kbd>Wheel</kbd> Switch Weapon</p>
        <p><kbd>R</kbd> Reload</p>
        <p><kbd>E</kbd> Pickup</p>
        <p><kbd>F</kbd> Bandage</p>
        <p><kbd>G</kbd> Grenade</p>
        <p><kbd>Space</kbd> Jump</p>
      </div>
      <button id="start-btn">START GAME</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
