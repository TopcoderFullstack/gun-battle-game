<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BATTLE ROYALE 3D - 缩圈吃鸡</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div id="hud-top">
        <div class="hud-item">
          <div class="hud-bar-bg">
            <div id="hp-bar" class="hud-bar hp"></div>
          </div>
          <span id="hp-text">100</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">KILLS</span>
          <span id="kills-text">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">SCORE</span>
          <span id="score-text">0</span>
        </div>
      </div>

      <div id="weapon-hud">
        <span id="weapon-name">FIST</span>
        <span id="ammo-text" class="ammo">∞</span>
      </div>

      <!-- Backpack Panel -->
      <div id="backpack-panel">
        <div class="bp-section">
          <span class="bp-label">WEAPONS</span>
          <div id="slot-1" class="bp-slot">1: --</div>
          <div id="slot-2" class="bp-slot">2: --</div>
        </div>
        <div class="bp-section">
          <span class="bp-label">ITEMS</span>
          <div id="item-bandage" class="bp-item">--</div>
          <div id="item-medkit" class="bp-item">--</div>
          <div id="item-armor" class="bp-item">--</div>
        </div>
      </div>

      <!-- Zone Info -->
      <div id="zone-info">
        <span id="zone-phase">Phase 1/7</span>
        <span id="zone-timer">30s</span>
      </div>

      <!-- Alive Count -->
      <div id="alive-info">
        <span id="alive-count">Alive: 12</span>
      </div>

      <div id="crosshair">
        <span class="ch-line ch-top"></span>
        <span class="ch-line ch-bottom"></span>
        <span class="ch-line ch-left"></span>
        <span class="ch-line ch-right"></span>
        <span class="ch-dot"></span>
      </div>

      <div id="damage-flash"></div>
    </div>

    <!-- Overlay -->
    <div id="overlay">
      <div id="overlay-box">
        <h1>GUN BATTLE 3D</h1>
        <p class="sub">第一人称射击 · FPS Arena</p>
        <div class="controls">
          <p><kbd>WASD</kbd> 移动 Move</p>
          <p><kbd>Mouse</kbd> 瞄准 Aim</p>
          <p><kbd>Click</kbd> 射击 Shoot</p>
          <p><kbd>1 2</kbd> 切换武器 Switch</p>
          <p><kbd>R</kbd> 换弹 Reload</p>
          <p><kbd>Space</kbd> 跳跃 Jump</p>
        </div>
        <button id="start-btn">START GAME</button>
      </div>
    </div>

    <div id="reload-indicator">RELOADING...</div>
    <div id="hit-marker">✕</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
